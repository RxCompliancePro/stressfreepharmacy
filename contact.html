<!DOCTYPE html>
<html lang="en">
<head>

    body { 
      font-family: 'Roboto', sans-serif; 
      background-color: #E6F0FA; 
      color: #1c1c1c;

    a { text-decoration: none; }

    /* Navbar */
    .navbar { 
      background-color: #1C3B70; 
      padding-top:20px;
      padding-bottom:20px;
    }
    .navbar-brand span:first-child { color:#fff; font-weight:700; font-size:1.8rem; }

    .nav-link { color:#fff !important; font-weight:500; }
    .nav-link.active, .nav-link:hover { color:#D4AF37 !important; }

    /* Hero */
    header {
      position: relative;
      color: #fff;
      text-align: center;
      min-height: calc(100vh - 100px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 20px;
      background: url('images/DESK.png') center center / cover no-repeat;
    }
    header::before {
      content:'';
      position:absolute;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.35);
      z-index:1;
    }
    header > .container { position: relative; z-index:2; }
    .hero-title { font-weight:700; font-size:2.5rem; margin-bottom:20px; color:#fff; }
    .hero-subtitle { font-size:1.2rem; max-width:700px; margin:0 auto; line-height:1.6; color:#fff; }
