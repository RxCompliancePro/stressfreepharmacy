    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

<main class="container mt-5">
  <h1>Contact Us</h1>
  <p class="lead mb-4">Reach out to discuss how Rxcelsior Solutions Inc. can support your pharmacy operations.</p>

  <!-- Replace YOUR_FORM_ID with your Formspree ID -->
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" name="name" placeholder="Your name" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input type="email" class="form-control" name="_replyto" placeholder="you@example.com" required>
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea class="form-control" name="message" rows="5" placeholder="Your message" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Send Message</button>
  </form>
</main>

<footer class="container mt-5 mb-5 text-center">
  <p>All engagements are confidential. Documentation may be securely deleted upon request once services are completed.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
